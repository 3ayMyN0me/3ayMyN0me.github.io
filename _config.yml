# ============================================================
#  SITE CONFIG  —  edit the values in this section to make it yours
# ============================================================

title:        "rootnotes"                       # short brand shown in the nav
author:       "Your Name"                        # your name (shows in footer + meta)
tagline:      "Offensive security writeups & field notes"
description:  "Personal lab notebook and portfolio of Vulnerable VM / Target machine writeups, exploitation walkthroughs, and security research notes."

# Where the site lives. See README for how to fill these in.
#  - User site  (repo named  username.github.io)  -> url: "https://username.github.io"   baseurl: ""
#  - Project site (repo named  notes)              -> url: "https://username.github.io"   baseurl: "/notes"
url:          "https://username.github.io"
baseurl:      ""

# Links shown in the hero / footer (leave blank to hide)
github:       "https://github.com/username"
linkedin:     "https://www.linkedin.com/in/username"
email:        "you@example.com"
resume_url:   "/assets/resume.pdf"               # drop a PDF in assets/ to enable

# ------------------------------------------------------------
#  Build settings — you normally do NOT need to touch these
# ------------------------------------------------------------
markdown:     kramdown
highlighter:  rouge
permalink:    /writeups/:title/
timezone:     Etc/UTC

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

plugins:
  - jekyll-seo-tag
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - preview.html
  - Gemfile
  - Gemfile.lock
  - vendor
